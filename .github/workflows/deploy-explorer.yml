name: Deploy explorer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'data/angels.json'
      - 'site/**'
      - 'scripts/validate-explorer.mjs'
      - 'scripts/explorer.test.mjs'
      - '.github/workflows/deploy-explorer.yml'
  pull_request:
    paths:
      - 'data/angels.json'
      - 'site/**'
      - 'scripts/validate-explorer.mjs'
      - 'scripts/explorer.test.mjs'
      - '.github/workflows/deploy-explorer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node scripts/validate-explorer.mjs
      - run: node --test scripts/explorer.test.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: |
          mkdir -p _site/data
          cp site/index.html site/app.js site/data-model.mjs site/styles.css _site/
          cp data/angels.json _site/data/angels.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
