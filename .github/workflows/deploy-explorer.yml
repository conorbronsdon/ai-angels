name: Deploy explorer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'data/angels.json'
      - 'site/**'
      - 'scripts/validate-explorer.mjs'
      - 'scripts/explorer.test.mjs'
      - '.github/workflows/deploy-explorer.yml'
  pull_request:
    paths:
      - 'data/angels.json'
      - 'site/**'
      - 'scripts/validate-explorer.mjs'
      - 'scripts/explorer.test.mjs'
      - '.github/workflows/deploy-explorer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/validate-explorer.mjs
      - run: node --test scripts/explorer.test.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          mkdir -p _site/data
          cp site/index.html site/app.js site/data-model.mjs site/styles.css _site/
          cp data/angels.json _site/data/angels.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
