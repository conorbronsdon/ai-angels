name: Suggest yourself or an angel
description: Share an active AI angel and a public source. We handle the directory update.
title: "Suggest: "
labels: ["suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest yourself or someone founders should know about. Share what you know below; the maintainer reviews the evidence and adds approved entries.

        Submitting requires a GitHub account and creates a public GitHub issue. Use public information only.

        We list people who write personal angel checks or lead a personal fund or syndicate, have an AI focus, and have public evidence of investing activity within the last 18 months. A current statement that they are actively investing also qualifies.
  - type: input
    id: name
    attributes:
      label: Name
    validations:
      required: true
  - type: input
    id: focus
    attributes:
      label: Focus
      description: The AI areas they invest in, such as infrastructure, developer tools, or applied AI.
      placeholder: AI infra, devtools
    validations:
      required: true
  - type: input
    id: reach
    attributes:
      label: Reach
      description: A pitch channel the person publishes themselves — their site, a public form, an X handle. No scraped emails.
    validations:
      required: true
  - type: input
    id: investments
    attributes:
      label: Notable AI investments (optional)
      description: Share publicly announced investments if you know them. Links are helpful.
    validations:
      required: false
  - type: input
    id: source
    attributes:
      label: Source for recent activity
      description: A public link dated inside the last 18 months — an announced check, a founder's thank-you, press, or a current "actively investing" statement from the person.
    validations:
      required: true
  - type: checkboxes
    id: self
    attributes:
      label: Optional
      options:
        - label: I'm suggesting myself.
          required: false
